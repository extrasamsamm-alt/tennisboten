name: Tennisboten
on:
  schedule:
    - cron: "17 * * * *"     # varje timme (minut 17)
  workflow_dispatch: {}      # går också att starta för hand under fliken Actions
permissions:
  contents: write
concurrency:
  group: tennisboten
  cancel-in-progress: false
jobs:
  kor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Stockholm
      TML_ALLTID_HAMTA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Kör ett varv (låtsasbet, rättning, sida)
        run: python bot.py kör
      - name: Publicera sidan och spara låtsasbeten
        run: |
          cp signaler.html docs/index.html
          git config user.name "tennisboten"
          git config user.email "tennisboten@users.noreply.github.com"
          git add docs/index.html data/paper
          git diff --cached --quiet || git commit -m "Boten: uppdatering $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
